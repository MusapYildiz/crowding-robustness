data:
  dataset: "coil100"
  coil_dir: "./coil100_raw/coil-100/coil-100"
  output_dir: "./dataset_coil"

  target_obj_ids: [2, 10, 16, 42, 43, 51, 66, 71, 79, 92]
  external_obj_ids: [11, 56, 57, 73, 74]

  split:
    train_ratio: 0.6
    val_ratio: 0.1
    test_ratio: 0.3
    random_seed: 42

  samples_per_condition: 50

image:
  canvas_size: 224
  object_size: 80
  background_color: 0       # siyah — COIL-100 ile seamless
  bg_threshold: 40          # siyah background maskeleme eşiği

spacing:
  pixels_per_degree: 40
  degrees: [2, 2.2, 2.5, 2.7, 3]
  measurement: "center_to_center"

flanker:
  types:
    - same_class
    - different_class
    - external
  positions: ["left", "right"]
  same_flanker_both_sides: true   # sol ve sağ aynı flanker instance
  allow_partial: true

training:
  models: ["resnet34", "resnet50", "resnet101", "vit_s_16", "vit_b_16",
           "convkan_s", "convkan_m", "convkan_l"]
  pretrained: true
  epochs: 30
  batch_size: 32
  learning_rate: 0.0001
  optimizer: "adam"
  early_stopping_patience: 5
  num_workers: 4
  device: "cuda"

evaluation:
  metrics:
    - accuracy_drop
    - spacing_accuracy_curve
    - per_class_accuracy
    - flanker_type_effect
    - ece
    - confusion_matrix
    - robustness_index
  results_dir: "./results"
